#_preseed_V1
# Debian 13 (trixie), amd64 Debian Installer (NOT live/Calamares).
# EDIT disk, bootdev, hostname, keyboard and BOTH encryption passphrase lines.
# WARNING: automatically replaces ALL partitions on the selected disk.
# Keep private: this file contains passwords. Test in a disposable VM first.

# Locale, keyboard, networking and time
d-i debian-installer/language string en
d-i debian-installer/country string LU
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select fi
d-i netcfg/choose_interface select auto
d-i netcfg/link_wait_timeout string 10
d-i netcfg/dhcp_timeout string 60
d-i netcfg/get_hostname string ax2
d-i netcfg/hostname string ax2
d-i netcfg/get_domain string
d-i hw-detect/load_firmware boolean true
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Luxembourg
d-i clock-setup/ntp boolean true

# Root still exists as a system account; password login is disabled.
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string tech
d-i passwd/username string tech
d-i passwd/user-password password abc12345
d-i passwd/user-password-again password abc12345

# Network package mirror: wired DHCP and Internet access required.
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i mirror/suite string trixie
d-i apt-setup/use_mirror boolean true
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/security_host string security.debian.org
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/disable-cdrom-entries boolean true

# Set BOTH disk paths explicitly, e.g. /dev/sda or /dev/nvme0n1.
# Built-in atomic recipe: / and swap in encrypted LVM, separate /boot;
# EFI System Partition when booted in UEFI mode.
d-i partman-auto/disk string /dev/sda
d-i partman-auto/method string crypto
d-i partman-auto/choose_recipe select atomic
d-i partman-auto-lvm/guided_size string max
d-i partman-auto-lvm/new_vg_name string system-vg
d-i partman-crypto/passphrase password diskpass_change_me
d-i partman-crypto/passphrase-again password diskpass_change_me
# Skip lengthy pre-encryption overwrite. This is NOT secure erasure of old data.
d-i partman-auto-crypto/erase_disks boolean false
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-crypto/confirm boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Standard GNOME desktop, SSH server, and requested extra packages (deduplicated).
tasksel tasksel/first multiselect standard, desktop, gnome-desktop, ssh-server
d-i pkgsel/include string sudo apache2 openssh-server git build-essential rsync libssl-dev bison flex bc screen net-tools nftables lz4 htop tmux dokuwiki gnupg scdaemon fido2-tools syncthing keepassxc ufw openssh-client opensc pcscd libccid curl wireguard-tools pcsc-tools opensc-pkcs11 cryptsetup systemd-cryptsetup libfido2-1 fido2-tools
d-i pkgsel/upgrade select safe-upgrade
popularity-contest popularity-contest/participate boolean false

# Install DokuWiki with ACL support, without creating a wiki administrator.
# Linux user tech is separate from DokuWiki users; configure wiki users later.
dokuwiki dokuwiki/wiki/acl boolean true
dokuwiki dokuwiki/wiki/superuser string
dokuwiki dokuwiki/system/purgepages boolean false
dokuwiki dokuwiki/system/writeconf boolean false
dokuwiki dokuwiki/system/writeplugins boolean false

# Boot loader and final setup
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string /dev/sda
d-i preseed/late_command string in-target usermod -a -G sudo,dialout,input tech
d-i finish-install/reboot_in_progress note
# Power off on completion so unattended USB boot cannot repeat the installation.
# Remove this line if you prefer automatic reboot (set boot order appropriately).
d-i debian-installer/exit/poweroff boolean true
